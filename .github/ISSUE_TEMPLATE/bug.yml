name: Bug report
description: Report a reproducible problem with synthetic data.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Include the revision, OS, steps, and synthetic input. Never attach real business data or credentials.
    validations:
      required: true
