[package]
name = "business-apps-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
business-apps-domain = { path = "../domain", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
  "Document", "Window", "Element", "Node", "NodeList", "HtmlCollection",
  "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement",
  "HtmlDialogElement", "HtmlFormElement", "HtmlButtonElement", "Event",
  "EventTarget", "RequestInit", "Headers", "Response", "ResizeObserver",
  "Blob", "Url", "HtmlAnchorElement",
] }
