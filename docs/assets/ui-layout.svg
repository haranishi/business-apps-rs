<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Business app workspace layout</title><desc id="desc">Navigation at left, record search and table at right, typed record editor in a dialog.</desc>
<rect width="960" height="450" rx="16" fill="#f5f7f8"/>
<g font-family="system-ui, sans-serif" fill="#203438">
<rect x="20" y="20" width="190" height="410" rx="12" fill="#e2eeed"/>
<text x="36" y="52" font-size="19" font-weight="700">business-apps-rs</text>
<rect x="36" y="78" width="155" height="36" rx="6" fill="#147d72"/>
<text x="56" y="102" font-size="15" fill="white">+ Create app</text>
<text x="36" y="157" font-size="15" font-weight="700">Apps</text>
<rect x="30" y="172" width="170" height="40" rx="6" fill="white"/>
<text x="42" y="198" font-size="15">Customers</text><text x="42" y="237" font-size="15">Inventory</text>
<text x="238" y="57" font-size="25" font-weight="700">Customers</text>
<rect x="238" y="80" width="286" height="36" rx="6" fill="white" stroke="#b7ccca"/>
<text x="251" y="103" font-size="14">Search record text...</text>
<rect x="796" y="80" width="136" height="36" rx="6" fill="#147d72"/><text x="814" y="103" font-size="14" fill="white">+ New record</text>
<rect x="238" y="139" width="694" height="232" rx="8" fill="white" stroke="#b7ccca"/>
<text x="258" y="168" font-size="14" font-weight="700">Name</text><text x="454" y="168" font-size="14" font-weight="700">Stock</text><text x="559" y="168" font-size="14" font-weight="700">Active</text>
<path d="M238 181H932 M238 226H932 M238 271H932" stroke="#dce6e5"/>
<text x="258" y="209" font-size="14">Example customer</text><text x="454" y="209" font-size="14">42</text><text x="559" y="209" font-size="14">Yes</text>
<text x="258" y="252" font-size="14">Another customer</text><text x="454" y="252" font-size="14">12</text>
<rect x="625" y="158" width="265" height="253" rx="12" fill="#ffffff" stroke="#147d72" stroke-width="2"/>
<text x="645" y="190" font-size="18" font-weight="700">Edit record</text><text x="645" y="222" font-size="14">Name *</text>
<rect x="645" y="233" width="224" height="33" rx="5" fill="#f5f7f8" stroke="#b7ccca"/><text x="653" y="255" font-size="13">Example customer</text>
<text x="645" y="289" font-size="14">Stock</text><rect x="645" y="300" width="224" height="33" rx="5" fill="#f5f7f8" stroke="#b7ccca"/>
<rect x="790" y="355" width="78" height="34" rx="6" fill="#147d72"/><text x="813" y="377" font-size="14" fill="white">Save</text>
<text x="705" y="377" font-size="14">Cancel</text><text x="239" y="406" font-size="13">Cursor pagination · stale edits show a revision conflict</text>
</g></svg>