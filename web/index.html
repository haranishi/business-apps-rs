<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>business-apps-rs | 業務アプリ</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#workspace">作業エリアへ</a>
  <header class="topbar"><a class="brand" href="/">business-apps<span>-rs</span></a><span class="local-badge">この端末のワークスペース</span></header>
  <div class="shell">
    <aside class="sidebar" aria-label="アプリナビゲーション">
      <div class="sidebar-heading"><h2>アプリ</h2><button id="create-app" class="primary">＋ アプリを作る</button></div>
      <nav id="app-nav" aria-label="アプリ一覧"></nav>
      <p class="sidebar-note">項目を決めて、仕事のデータをひとつに。</p>
    </aside>
    <main id="workspace" tabindex="-1">
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section id="welcome" class="welcome">
        <p class="eyebrow">YOUR WORK, YOUR APP</p><h1>仕事に合わせたアプリを、<br>ここから。</h1>
        <p>顧客リストも、在庫も、日々のタスクも。<br>必要な項目を選んで、自分のアプリを作りましょう。</p>
        <button id="first-app" class="primary large">最初のアプリを作る</button>
        <div class="templates"><button id="customer-template"><strong>顧客管理</strong><span>顧客名・連絡先・対応状況</span></button><button id="inventory-template"><strong>在庫管理</strong><span>商品名・数量・メモ</span></button></div>
      </section>
      <section id="app-workspace" hidden>
        <div class="page-heading"><div><p class="eyebrow">WORKSPACE</p><h1 id="app-title"></h1><p id="record-count" class="muted"></p></div><button id="new-record" class="primary">＋ レコードを追加</button></div>
        <form id="search-form" class="search"><label for="search">レコードを検索</label><div><input id="search" type="search" maxlength="128" placeholder="文字を入力して検索"><button type="submit">検索</button><button id="clear-search" type="button">クリア</button></div></form>
        <p id="table-hint" class="muted" hidden>表を横にスクロールして、項目や編集ボタンを表示できます。</p><div class="table-scroll"><table><caption class="sr-only" id="table-caption">レコード一覧</caption><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
        <div class="pagination"><button id="previous-page">前のページ</button><span id="page-number"></span><button id="next-page">次のページ</button></div>
      </section>
    </main>
  </div>
  <dialog id="app-dialog" aria-labelledby="app-dialog-title">
    <form id="app-form"><div class="dialog-heading"><h2 id="app-dialog-title">アプリを作る</h2><button type="button" class="close-app" aria-label="アプリ作成を閉じる">×</button></div>
      <label for="app-name">アプリ名</label><input id="app-name" required maxlength="80" placeholder="例：顧客管理">
      <div class="section-heading"><h3>項目</h3><span class="muted">最大32項目</span></div><div id="field-builder"></div><button type="button" id="add-field">＋ 項目を追加</button>
      <p id="app-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="close-app">キャンセル</button><button id="save-app" type="submit" class="primary">アプリを作成</button></div>
    </form>
  </dialog>
  <dialog id="record-dialog" aria-labelledby="record-dialog-title">
    <form id="record-form"><div class="dialog-heading"><h2 id="record-dialog-title">レコードを追加</h2><button type="button" class="close-record" aria-label="レコード編集を閉じる">×</button></div>
      <div id="record-fields"></div><p id="record-error" class="error" role="alert"></p><button id="reload-record" type="button" hidden>最新版を読み込む（入力内容を置き換えます）</button>
      <div class="dialog-actions"><button id="delete-record" type="button" class="danger" hidden>削除</button><span class="spacer"></span><button type="button" class="close-record">キャンセル</button><button id="save-record" type="submit" class="primary">保存</button></div>
    </form>
  </dialog>
</body>
</html>
